{% extends "base.html" %} {% block title %} Querysubmit {% endblock %} {% block content %}
<br />
<h1 align="center">Inspect your table</h1>
<br />
<div class="row mb-3">
  <label for="table" class="col-sm-2 col-form-label"> <p class="font-weight-bold">Chosen table</p> </label>
  <div class="border border-secondary p-2 mb-2" style="width: 300px;"> {{table}} </div>  
</div>

<div class="row mb-lg-3">
  <label for="table" class="col-sm-2 col-form-label"> <p class="font-weight-bold">Maximum of {{chemElm}}</p> </label>
  <div class="border border-secondary p-2 mb-2" style="width: 300px;"> {{maxChemElm[0][0]}} (WT%) </div>  
</div>

<div class="row mb-3">
  <label for="table" class="col-sm-2 col-form-label"> <p class="font-weight-bold">Minimum of {{chemElm}}</p> </label>
  <div class="border border-secondary p-2 mb-2" style="width: 300px;"> {{minChemElm[0][0]}} (WT%) </div>
</div>



<div class="row mb-3">
  <label for="table" class="col-sm-2 col-form-label"> <p class="font-weight-bold">Harker diagrams</p> </label>
  <div class="border border-secondary p-2 mb-2" style="width: 900px;"> <div> 
    <center><img src="{{url_for('static', filename='/images/'+image)}}"  width="800" class="centerImage"></center>
  </div> </div>
</div>


<div class="row mb-3">
  <label for="table" class="col-sm-2 col-form-label"> <p class="font-weight-bold">Selected attribute: {{selectCol}}</p> </label>
  <div class="border border-secondary p-2 mb-2" style="width: 400px;"> {%for i in selectOutput%}
    {{i[0]}}
    <br/>
  {%endfor%} </div>
</div>

{% endblock %}
