{% extends "base.html" %} {% block title %}Query{% endblock %} {% block content %}
<br />
<h1 align="center">Inspect a table</h1>
    <br/>
    <p> Choose the table you want to inspect. </p>
    <p style="font-family:verdana">
      <SELECT name="tablename" style="font-family:verdana">
      {% for t in tablelist %}
        <OPTION value={{t[0]}}>{{t[0]}}</OPTION>
      {% endfor %}
      </SELECT>
      </p>
    <br/>

        <label for="chemElm1"> Compute maximum samplevalue of a chemical element. </label>

          type="text"
          class="form-control"
          id="chemElm1"
          name="chemElm1"
          placeholder="Enter a chemical element" />
      </div>
      <div class="form-group">
        <label for="chemElm2"> Compute minimum samplevalue of a chemical element.</label>
        <input
          type="text"
          class="form-control"
          id="chemElm2"
          name="chemElm2"
          placeholder="Enter a chemical element" />
      </div>
      <br />
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    {% endblock %}
