{% extends "base.html" %} {% block title %}Query{% endblock %} {% block content %}
<br />
<h1 align="center">Inspect a table</h1>

<form method="POST">
    <br/>
    <div class="form-group">
    <label for="table"> Choose the table you want to inspect. </label>
    <br />
      <SELECT id="table" name="table">
      {% for t in tablelist %}
        <OPTION value={{t[0]}}>{{t[0]}}</OPTION>
      {% endfor %}
      </SELECT>
    </div>


    <p> Here you can get the max and min of your chosen chemical element. </p>

      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <label class="input-group-text" for="inputGroupSelect01">Options</label>
        </div>
      <select class="custom-select" id="chemElm" name="chemElm">
        <option value="SiO2">SiO2</option>
        <option value="Al2O3">Al2O3</option>
        <option value="CaO">CaO</option>
        <option value="Na2O">Na2O</option>
        <option value="K2O">K2O</option>
        <option value="FeO">FeO</option>
        <option value="Fe2O3">Fe2O3</option>
        <option value="FeO_total">FeO_total</option>
        <option value="MgO" selected >MgO</option>
        <option value="MnO">MnO</option>
        <option value="P2O5">P2O5</option>
      </select>
      </div>


      <p> Select something you wish to know from your chosen table. </p>
      

      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <label class="input-group-text" for="inputGroupSelect01">Options</label>
        </div>
      <select class="custom-select" id="selectCol" name="selectCol">
        <option value="location" selected> location</option>
        <option value="tectonic_set">tectonic_set</option>
        <option value="rock_name">rock_name</option>
        <option value="rock_type">rock_type</option>
        <option value="material">material</option>
        <option value="loss">loss</option>
      </select>
      </div>

      <br />
      <button type="submit" class="btn btn-dark">Submit</button>
    </form>

    {% endblock %}
