{% extends "base.html" %} {% block title %}Info{% endblock %} {% block content %}
<br />
  <h3 align="center">Your information </h3>
    <form method = "POST" enctype="multipart/form-data" action = "/"> 
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="firstName"
              placeholder="Enter first name"
            />
          </div>
          <br />
          <form method="POST">
            <textarea name="note" id="note" class="form-control" placeholder="Write anything you wish - mabye your visited locations, experiences, and former occupations."></textarea>
            <br />
            <div align="center"> 

              <button type="submit" class="btn btn-primary"> Submit </button>
            </div>
          </form>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
{% endblock %}
